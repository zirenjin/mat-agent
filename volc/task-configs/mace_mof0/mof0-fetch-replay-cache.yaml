TaskName: mof0_fetch_mp_replay_cache
Description: 'Fetch MACE MP replay assets (mp_traj_combined.xyz + descriptors.npy)
  via ghproxy mirror into the vePFS shared cache so the training task can start
  without waiting on GitHub direct. Exits after download; no GPU training.'
Tags:
- mace-mof0
- fetch-only
- mp-replay-cache
Entrypoint: |
  set -Eeuo pipefail
  export PYTHONUNBUFFERED=1
  ROOT=/GenSIvePFS/users/public/mat-agent
  RUN_DIR="$ROOT/data/mace_mof_0/runs/fetch_replay_cache_$(date -u +%Y%m%dT%H%M%SZ)"
  mkdir -p "$RUN_DIR"
  cd "$ROOT"

  # Find a working Python (any env with requests/urllib is fine)
  PYBIN=""
  for candidate in \
      /opt/conda/bin/python \
      /opt/miniconda3/bin/python \
      /root/miniconda3/envs/mlip_agent/bin/python \
      /root/miniconda3/bin/python \
      /usr/local/bin/python3 \
      /usr/bin/python3; do
    if [ -x "$candidate" ]; then
      PYBIN="$candidate"
      break
    fi
  done
  echo "MACE_MOF0_FETCH_PYTHON=$PYBIN"

  "$PYBIN" volc/scripts/mace_mof0_prepare_mp_replay_cache.py \
    --run-dir "$RUN_DIR" \
    --shared-cache-dir "$ROOT/data/mace_mof_0/runs/shared/mp_replay_cache" \
    --retries-per-url 2 \
    --timeout 600

  echo "MACE_MOF0_FETCH_DONE"
Envs:
- Name: PYTHONUNBUFFERED
  Value: '1'
  IsPrivate: false
ImageUrl: gensi-cn-beijing.cr.volces.com/ai4science/mlip_agent:v1
ResourceQueueName: sia-thu
Framework: PyTorchDDP
TaskRoleSpecs:
- RoleName: worker
  RoleReplicas: 1
  Flavor: ml.pni2.14xlarge
ActiveDeadlineSeconds: 7200
DelayExitTimeSeconds: 0
EnableTensorBoard: false
Storages:
- Type: TosFuse
  MountPath: /sia-thu
  Bucket: sia-thu
  Prefix: /
- Type: Vepfs
  MountPath: /GenSIvePFS/users/public/mat-agent
  ReadOnly: false
  SubPath: users/public/mat-agent
  VepfsId: vepfs-cnbj5912665bc1be
AccessType: Public
Preemptible: false
Priority: 4
RetryOptions:
  EnableRetry: false
  EnableReserveResourceOnRetry: false
DiagOptions:
- Name: EnvironmentalDiagnosis
  Enable: false
- Name: PythonDetection
  Enable: false
- Name: LogDetection
  Enable: false
- Name: VecclHangDetection
  Enable: false
