TaskName: mof0_benchmark_baseline
Description: 'Generate the FROZEN human baseline for the MACE-MP-MOF0 Autonomous
  Discovery benchmark: score foundation / mofs_v1 / mofs_v2 through
  benchmark/evaluation/evaluate_mof0.py (Stage A ML + Stage B physics on the 4
  MOFs), write baseline_scores.json + baseline_context.json + noise_estimate.json.
  1 GPU. Bootstraps mace-torch==0.3.9 + phonopy==2.29.0. Resumable.'
Tags:
- mace-mof0
- benchmark-baseline
- evaluator
- runtime-bootstrap
Entrypoint: 'cd /GenSIvePFS/users/public/mat-agent

  bash volc/scripts/run_benchmark_baseline.sh'
Envs:
- Name: MACE_MOF0_ROOT
  Value: /GenSIvePFS/users/public/mat-agent
  IsPrivate: false
- Name: BASELINE_RUN_ID
  Value: benchmark_baseline_20260906
  IsPrivate: false
- Name: BASELINE_OUT_DIR
  Value: /GenSIvePFS/users/public/mat-agent/runs/_baseline
  IsPrivate: false
- Name: TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD
  Value: '1'
  IsPrivate: false
- Name: PYTHONUNBUFFERED
  Value: '1'
  IsPrivate: false
ImageUrl: gensi-cn-beijing.cr.volces.com/ai4science/mlip_agent:v1
ResourceQueueName: sia-thu
Framework: PyTorchDDP
TaskRoleSpecs:
- RoleName: worker
  RoleReplicas: 1
  Flavor: ml.pni2.3xlarge
ActiveDeadlineSeconds: 172800
DelayExitTimeSeconds: 0
EnableTensorBoard: true
Storages:
- Type: TosFuse
  MountPath: /sia-thu
  Bucket: sia-thu
  Prefix: /
- Type: Vepfs
  MountPath: /GenSIvePFS/users/model
  ReadOnly: false
  SubPath: users/model
  VepfsId: vepfs-cnbj5912665bc1be
- Type: Vepfs
  MountPath: /GenSIvePFS/users/public/mat-agent
  ReadOnly: false
  SubPath: users/public/mat-agent
  VepfsId: vepfs-cnbj5912665bc1be
TensorBoardStorage:
  Type: Vepfs
  MountPath: /tensorboard_logs
  ReadOnly: false
  SubPath: users/public/mat-agent/tensorboard_logs
  VepfsId: vepfs-cnbj5912665bc1be
AccessType: Public
Preemptible: false
Priority: 4
RetryOptions:
  EnableRetry: false
  EnableReserveResourceOnRetry: false
DiagOptions:
- Name: EnvironmentalDiagnosis
  Enable: false
- Name: PythonDetection
  Enable: false
- Name: LogDetection
  Enable: false
- Name: VecclHangDetection
  Enable: false
