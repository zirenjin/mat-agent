TaskName: mof0_curvature_ft_e1
Description: 'H1 Experiment E1: A0 short single-head pbe_d3 fine-tune of the fixed
  MACE-MP-0b foundation on the discovery dev split (probe scale: 50 epochs
  float32), then A1/A2/A3 Hessian dynamical-stability polish (beta sweep +
  strict-minima subset), then a phonon-stability proxy eval on 3 held-out dev
  systems. Produces per-arm checkpoints + eval.json + summary.json. 1 GPU.
  Bootstraps mace-torch==0.3.9 + phonopy==2.29.0. Resumable.'
Tags:
- mace-mof0
- h1-experiment-e1
- stability-regularizer
- runtime-bootstrap
Entrypoint: 'cd /GenSIvePFS/users/public/mat-agent

  bash volc/scripts/run_curvature_ft_e1.sh'
Envs:
- Name: MACE_MOF0_ROOT
  Value: /GenSIvePFS/users/public/mat-agent
  IsPrivate: false
- Name: MACE_ABL_EPOCHS
  Value: '50'
  IsPrivate: false
- Name: MACE_ABL_DTYPE
  Value: float64
  IsPrivate: false
- Name: MACE_ABL_BATCH
  Value: '16'
  IsPrivate: false
- Name: MACE_ABL_POLISH_STEPS
  Value: '300'
  IsPrivate: false
- Name: TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD
  Value: '1'
  IsPrivate: false
- Name: PYTHONUNBUFFERED
  Value: '1'
  IsPrivate: false
ImageUrl: gensi-cn-beijing.cr.volces.com/ai4science/mlip_agent:v1
ResourceQueueName: sia-thu
Framework: PyTorchDDP
TaskRoleSpecs:
