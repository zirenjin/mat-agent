TaskName: mof0_h2_longrange
Description: 'H2 (architecture / physical inductive bias): bolt a lightweight
  learnable long-range dispersion head (per-element sqrt(C6) + BJ damping,
  15 A cutoff) onto the FROZEN MACE-MP-0b foundation. Precompute foundation
  residuals on dev_train, fit the head to explain them, then proxy-eval
  (H2 vs foundation) on dev_eval E/F/stress + phonon-stability proxy.
  Cheap (no MACE in the fit loop). 1 GPU. Resumable.'
Tags:
- mace-mof0
- h2-architecture
- long-range-head
- runtime-bootstrap
Entrypoint: 'cd /GenSIvePFS/users/public/mat-agent

  bash volc/scripts/run_h2_longrange.sh'
Envs:
- Name: MACE_MOF0_ROOT
  Value: /GenSIvePFS/users/public/mat-agent
  IsPrivate: false
- Name: H2_STEPS
  Value: '1200'
  IsPrivate: false
- Name: H2_WF
  Value: '2.0'
  IsPrivate: false
- Name: TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD
  Value: '1'
  IsPrivate: false
- Name: PYTHONUNBUFFERED
  Value: '1'
  IsPrivate: false
ImageUrl: gensi-cn-beijing.cr.volces.com/ai4science/mlip_agent:v1
ResourceQueueName: sia-thu
Framework: PyTorchDDP
TaskRoleSpecs:
- RoleName: worker
  RoleReplicas: 1
  Flavor: ml.pni2.3xlarge
ActiveDeadlineSeconds: 86400
DelayExitTimeSeconds: 0
EnableTensorBoard: true
Storages:
- Type: TosFuse
  MountPath: /sia-thu
  Bucket: sia-thu
  Prefix: /
- Type: Vepfs
  MountPath: /GenSIvePFS/users/model
  ReadOnly: false
  SubPath: users/model
  VepfsId: vepfs-cnbj5912665bc1be
- Type: Vepfs
  MountPath: /GenSIvePFS/users/public/mat-agent
  ReadOnly: false
  SubPath: users/public/mat-agent
  VepfsId: vepfs-cnbj5912665bc1be
TensorBoardStorage:
  Type: Vepfs
  MountPath: /tensorboard_logs
  ReadOnly: false
  SubPath: users/public/mat-agent/tensorboard_logs
  VepfsId: vepfs-cnbj5912665bc1be
AccessType: Public
Preemptible: false
Priority: 4
RetryOptions:
  EnableRetry: false
  EnableReserveResourceOnRetry: false
DiagOptions:
- Name: EnvironmentalDiagnosis
  Enable: false
- Name: PythonDetection
  Enable: false
- Name: LogDetection
  Enable: false
- Name: VecclHangDetection
