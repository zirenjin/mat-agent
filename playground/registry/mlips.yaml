# Agent-visible MLIP registry. This replaces the legacy models/<model>/api view.

runner:
  name: mattertune
  repo_path: mattertune
  import_name: mattertune
  train_entrypoint: docker/entrypoints/train.sh
  predict_entrypoint: docker/entrypoints/predict.sh
  default_output_root: playground/runs

allowed_operation_classes:
  finetune:
    description: Tune approved hyperparameters and MatterTune-supported adaptation settings.
  multihead:
    description: Use MatterTune/backbone-supported multi-head fine-tuning without changing architecture code.
  replay:
    description: Use approved replay datasets that pass dataset_guard checks.
  freeze_layers:
    description: Freeze/unfreeze supported backbone layers via configuration only.

backbones:
  mace:
    mattertune_config: MACEBackboneConfig
    status: supported_by_mattertune
    allowed_operations: [finetune, replay, freeze_layers]
    architecture_editable: false
  uma:
    mattertune_config: UMABackboneConfig
    status: supported_by_mattertune
    allowed_operations: [finetune, replay, freeze_layers]
    architecture_editable: false
  deepmd:
    mattertune_config: DeepMDBackboneConfig
    status: supported_by_mattertune_branch
    allowed_operations: [finetune, multihead, replay, freeze_layers]
    architecture_editable: false
  mattersim:
    mattertune_config: MatterSimBackboneConfig
    status: supported_by_mattertune
    allowed_operations: [finetune, replay, freeze_layers]
    architecture_editable: false
  sevennet:
    mattertune_config: SevenNetBackboneConfig
    status: supported_by_mattertune
    allowed_operations: [finetune, replay, freeze_layers]
    architecture_editable: false
  orb:
    mattertune_config: ORBBackboneConfig
    status: supported_by_mattertune
    allowed_operations: [finetune, replay, freeze_layers]
    architecture_editable: false

protected:
  forbidden_agent_edits:
    - mattertune/src/mattertune/backbones/**
    - mattertune/src/mattertune/configs/backbones/**
  note: Agent tasks may configure backbones but must not patch architecture source.

