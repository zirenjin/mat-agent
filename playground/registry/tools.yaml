tools:
  verdict:
    command: python3 tools/verdict.py
    image: mat-agent/base:latest
    visible_to_agent: true
    purpose: score canonical pred_* fields against ref_* labels
  anomaly_sniffer:
    command: python3 tools/anomaly_sniffer.py
    image: mat-agent/base:latest
    visible_to_agent: true
    purpose: classify runtime logs and simple physical failure diagnostics
  run_logged_docker:
    command: bash tools/run_logged_docker.sh
    image: host
    visible_to_agent: true
    purpose: launch docker commands with stable log and metadata artifacts
  runner_controller:
    command: python3 tools/runner_controller.py
    image: host
    visible_to_agent: true
    purpose: stream training telemetry and classify recoverable runtime failures
