tasks:
  mace_matpes_pbe_smoke:
    kind: fine_tune
    model: mace
    dataset: matpes_pbe
    foundation_model: /root/.cache/mace/20231203mace128L1_epoch199model
    script: playground/scripts/train_mace_matpes.sh
    defaults:
      CONFIG: pbe
      TRAIN_N: 800
      VAL_N: 100
      TEST_N: 100
      EPOCHS: 20
      BATCH_SIZE: 8
      LR: 0.005
      FORCES_WEIGHT: 1000
      ENERGY_WEIGHT: 1
  mace_matpes_r2scan_smoke:
    kind: fine_tune
    model: mace
    dataset: matpes_r2scan
    foundation_model: /root/.cache/mace/20231203mace128L1_epoch199model
    script: playground/scripts/train_mace_matpes.sh
    defaults:
      CONFIG: r2scan
      TRAIN_N: 800
      VAL_N: 100
      TEST_N: 100
      EPOCHS: 20
      BATCH_SIZE: 8
      LR: 0.003
      FORCES_WEIGHT: 1000
      ENERGY_WEIGHT: 1
