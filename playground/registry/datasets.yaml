# Agent-visible registry of full datasets available to this workspace.
# This file is factual: it records locations, formats, precision/DFT level, and
# whether train/validation/test splits are present. It does not list
# downselected or task-specific derived splits.

datasets:
  wbm_matbench_discovery:
    name: WBM Benchmark Test Set
    source: matbench_discovery
    source_metadata: third_party/matbench-discovery/data/datasets.yml#WBM
    role: full_discovery_test_set
    n_structures: 256963
    n_materials: 215488
    precision:
      method: DFT
      code: VASP
      functional: PBE+U
      pseudopotentials: PBE
    files:
      summary: third_party/matbench-discovery/data/wbm/2023-12-13-wbm-summary.csv.gz
      initial_structures_zip: 2024-08-04-wbm-initial-atoms.extxyz.zip
      root_summary_copy: 2023-12-13-wbm-summary.csv.gz
      mp_elemental_references: third_party/matbench-discovery/data/mp/2023-02-07-mp-elemental-reference-entries.json.gz
      datasets_index: third_party/matbench-discovery/data/datasets.yml
    formats:
      summary: csv_gzip
      structures: extxyz_zip
      references: json_gzip
      metadata: yaml
    splits:
      train: false
      validation: false
      test: true
      split_note: WBM is registered here as the full Matbench Discovery benchmark test set.
    labels:
      - formation_energy
      - energy_above_hull_or_stability_fields_in_summary
    notes:
      - Keep downselected WBM subsets outside this full-dataset registry.
      - Official model prediction archives are intentionally excluded from this repository.

  matpes_pbe_full:
    name: MatPES v1.0 PBE
    source: materialyze/matpes
    source_metadata: third_party/matbench-discovery/data/datasets.yml#MatPES_PBE
    role: full_mlip_training_source
    n_structures: 434712
    precision:
      method: DFT
      code: VASP
      code_version: 6.4.x
      functional: PBE
      pseudopotentials: PBE_64
    files:
      local_train_cache: data/matpes/_cache/pbe__train__0000.parquet
      upstream_download_url: https://s3.us-east-1.amazonaws.com/materialsproject-contribs/MatPES_2025_1/MatPES-PBE-2025.1.json.gz
    formats:
      local_cache: parquet
      upstream_archive: json_gzip
    splits:
      train: true
      validation: false
      test: false
      split_note: The local full-data cache currently records the upstream train shard only; framework-defined validation/test splits are not registered here.
    labels:
      energy: ref_energy
      forces: ref_forces
      stress: ref_stress
    notes:
      - Keep downselected MATPES training subsets outside this full-dataset registry.

  matpes_r2scan_full:
    name: MatPES v1.0 r2SCAN
    source: materialyze/matpes
    source_metadata: third_party/matbench-discovery/data/datasets.yml#MatPES_r2SCAN
    role: full_mlip_training_source
    n_structures: 387897
    precision:
      method: DFT
      code: VASP
      code_version: 6.4.x
      functional: r2SCAN
      pseudopotentials: PBE_64
    files:
      local_train_cache: data/matpes/_cache/r2scan__train__0000.parquet
      upstream_download_url: https://s3.us-east-1.amazonaws.com/materialsproject-contribs/MatPES_2025_1/MatPES-R2SCAN-2025.1.json.gz
    formats:
      local_cache: parquet
      upstream_archive: json_gzip
    splits:
      train: true
      validation: false
      test: false
      split_note: The local full-data cache currently records the upstream train shard only; framework-defined validation/test splits are not registered here.
    labels:
      energy: ref_energy
      forces: ref_forces
      stress: ref_stress
    notes:
      - Keep downselected MATPES training subsets outside this full-dataset registry.
