# Agent-visible dataset registry.
#
# This registry records canonical dataset identities and split visibility. It is
# not a place for derived splits, ad hoc downsampling, or generated artifacts.
# Agents may read registered train/validation data during training. Protected
# test/OOD splits are only visible to evaluation tasks through evaluate.sh.

api_version: 1
registry_kind: dataset_registry

split_policy:
  train:
    train_visible: true
    evaluate_visible: true
    mutable_by_agent: false
  validation:
    train_visible: true
    evaluate_visible: true
    mutable_by_agent: false
  test:
    train_visible: false
    evaluate_visible: true
    mutable_by_agent: false
    protected: true
  ood:
    train_visible: false
    evaluate_visible: true
    mutable_by_agent: false
    protected: true

canonical_roots:
  local_data: data
  scoring_sources: scoring

datasets:
  wbm_matbench_discovery:
    name: WBM Benchmark Test Set
    source: matbench_discovery
    role: protected_discovery_benchmark
    source_metadata: scoring/adapters/matbench_discovery/upstream/data/datasets.yml#WBM
    n_structures: 256963
    n_materials: 215488
    precision:
      method: DFT
      code: VASP
      functional: PBE+U
      pseudopotentials: PBE
    files:
      summary: scoring/adapters/matbench_discovery/upstream/data/wbm/2023-12-13-wbm-summary.csv.gz
      initial_structures_zip: 2024-08-04-wbm-initial-atoms.extxyz.zip
      mp_elemental_references: scoring/adapters/matbench_discovery/upstream/data/mp/2023-02-07-mp-elemental-reference-entries.json.gz
      datasets_index: scoring/adapters/matbench_discovery/upstream/data/datasets.yml
    formats:
      summary: csv_gzip
      structures: extxyz_zip
      references: json_gzip
      metadata: yaml
    registered_splits:
      test:
        present: true
        protected: true
        train_visible: false
        mutable_by_agent: false
    labels: [formation_energy, energy_above_hull_or_stability_fields_in_summary]
    notes:
      - Register WBM here only as the protected benchmark source.
      - Downselected WBM subsets belong in benchmark task manifests or run-local records.

  matpes_pbe_full:
    name: MatPES v1.0 PBE
    source: materialyze/matpes
    role: canonical_training_source
    source_metadata: scoring/adapters/matbench_discovery/upstream/data/datasets.yml#MatPES_PBE
    n_structures: 434712
    precision:
      method: DFT
      code: VASP
      code_version: 6.4.x
      functional: PBE
      pseudopotentials: PBE_64
    files:
      local_train_cache: data/matpes/_cache/pbe__train__0000.parquet
      upstream_download_url: https://s3.us-east-1.amazonaws.com/materialsproject-contribs/MatPES_2025_1/MatPES-PBE-2025.1.json.gz
    formats:
      local_cache: parquet
      upstream_archive: json_gzip
    registered_splits:
      train:
        present: true
        train_visible: true
        mutable_by_agent: false
      validation:
        present: false
      test:
        present: false
    labels:
      energy: ref_energy
      forces: ref_forces
      stress: ref_stress
    notes:
      - Framework-level validation/test splits are not registered yet.
      - Task-specific splits must be recorded in run-local manifests under playground/runs.

  matpes_r2scan_full:
    name: MatPES v1.0 r2SCAN
    source: materialyze/matpes
    role: canonical_training_source
    source_metadata: scoring/adapters/matbench_discovery/upstream/data/datasets.yml#MatPES_r2SCAN
    n_structures: 387897
    precision:
      method: DFT
      code: VASP
      code_version: 6.4.x
      functional: r2SCAN
      pseudopotentials: PBE_64
    files:
      local_train_cache: data/matpes/_cache/r2scan__train__0000.parquet
      upstream_download_url: https://s3.us-east-1.amazonaws.com/materialsproject-contribs/MatPES_2025_1/MatPES-R2SCAN-2025.1.json.gz
    formats:
      local_cache: parquet
      upstream_archive: json_gzip
    registered_splits:
      train:
        present: true
        train_visible: true
        mutable_by_agent: false
      validation:
        present: false
      test:
        present: false
    labels:
      energy: ref_energy
      forces: ref_forces
      stress: ref_stress
    notes:
      - Framework-level validation/test splits are not registered yet.
      - Task-specific splits must be recorded in run-local manifests under playground/runs.
