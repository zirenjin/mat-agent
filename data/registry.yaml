datasets:
  wbm_1k:
    path: data/wbm_1k
    status: local_sample_present
    roles: [test_sample]
    protected_splits: [test]
  matpes:
    path: data/matpes
    status: local_cache_present
    roles: [mlip_training_source]
    protected_splits: []
  matpes_ft_50k:
    path: data/matpes_ft_50k
