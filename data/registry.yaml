  rmd17_aspirin_ft:
    path: data/rmd17_aspirin_ft
    status: local_finetune_subset_present
    roles: [train, test]
    protected_splits: [test]
policy:
  canonical_raw_protected: true
  derived_data_root: playground/runs/<run_id>/data

