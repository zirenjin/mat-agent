env_id: BENCHMARK-SOFT-LIZNINIO-004
task_type: small_data_dynamic_adaptation
source_registry_env_id: ANVIL-SOFT-LIZNINIO-004
foundation_models:
  - name: CHGNet
    path_or_source: unsupported_in_this_smoke_test
    status: dependency_missing_in_default_python
  - name: MACE-MP-0
    path_or_source: models/checkpoints/mace/mace-mpa-0-medium.model
    status: zero_shot_and_naive_finetune_ran_via_docker
episode:
  initial_visible_frames: [0, 1, 3]
  oracle_budget_levels: [1, 3, 10]
  max_rounds: 3
  max_train_minutes_per_round: 10
  reduced_mode: true
splits:
  oracle_pool: benchmark/envs/softening_liznino/splits/oracle_pool_ids.txt
  validation: benchmark/envs/softening_liznino/splits/validation_ids.txt
  hidden_test: benchmark/envs/softening_liznino/splits/hidden_test_ids.txt
actions:
  - zero_shot_eval
  - query_oracle
  - fine_tune
  - evaluate
  - finish
feedback_channels:
  - aggregate_force_mae
  - aggregate_energy_mae
  - per_element_force_mae
  - training_log
score:
  primary_metric: force_mae
  secondary_metrics:
    - energy_mae_per_atom
    - missing_predictions
  hard_gates:
    - name: excessive_missing_predictions
      threshold: 0.05
      unit: fraction
    - name: force_mae_exploded
      threshold: 10.0
      unit: eV_per_angstrom
baseline_plan:
  zero_shot: completed
  random_oracle_naive_finetune: completed_budgets_1_3_10_seeds_0_1_2
  paper_inspired: one_label_linear_correction_stub
notes:
  - "Repository directories use benchmark naming even when the scientific project is ANVIL/TEMPER."
  - "First experiment should not run frontier LLM agents."
  - "Downstream observables are intentionally deferred for this reduced environment."
